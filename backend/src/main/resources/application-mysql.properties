# ---- MySQL Production Database ----
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:starter_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' keeps schema in sync without dropping tables on startup/shutdown.
# 'create-drop' wiped the whole DB on every (dev-tools) restart and produced the
# "alter table ... drop foreign key [Table doesn't exist]" warning wall on a fresh DB.
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false

