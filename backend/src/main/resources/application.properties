# ---- Application ----
spring.application.name=starter_project_2025
server.port=8080

# ---- Active Profile ----
spring.profiles.active=${APP_PROFILE:mysql}

# ---- JWT ----
jwt.secret=${JWT_SECRET}
jwt.access-token.duration=${JWT_ACCESS_TOKEN_DURATION:3600}
jwt.refresh-token.duration=${JWT_REFRESH_TOKEN_DURATION:604800}
jwt.password-one-time-token.duration=${JWT_ONE_TIME_TOKEN_DURATION:900}

# ---- Mail ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Google OAuth2 ----
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# ---- AI (Google Gemini — generateContent REST API) ----
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# ---- Forvo (audio phát âm — tùy chọn; trống thì frontend dùng TTS) ----
forvo.api-key=${FORVO_API_KEY:}

# ---- Sudachi (phân tích hình thái tiếng Nhật — Java native, không cần Python) ----
# Từ điển Core (~70 MB) được download 1 lần qua: ./mvnw generate-resources
# và được đặt vào classpath tự động. Không cần cấu hình thêm nếu dùng đường thông thường.
# Override nếu muốn chỉ định đường dẫn file dict riêng:
sudachi.dict-path=${SUDACHI_DICT_PATH:}

# ---- Cloudinary ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ---- File Upload ----
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.file-size-threshold=10MB
app.file.upload-dir=${FILE_UPLOAD_DIR:uploads}
app.file.max-size=${FILE_MAX_SIZE:10485760}

# ---- Redis Cache ----
app.cache.enabled=${CACHE_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---- Rate Limiting ----
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:120}

# ---- CORS ----
app.frontend-domain=${APP_FRONTEND_DOMAIN}
app.backend-domain=${APP_BACKEND_DOMAIN}

# ---- Async ----
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

# ---- Thymeleaf ----
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ---- Swagger ----
swagger.server-url=${APP_BACKEND_DOMAIN:http://localhost:8080}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.default-model-rendering=example
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.oauth.client-id=${GOOGLE_CLIENT_ID}
springdoc.swagger-ui.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
springdoc.swagger-ui.oauth.scopes=email,profile
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# ---- Tomcat ----
server.max-http-request-header-size=65536

# ---- Misc ----
spring.main.allow-bean-definition-overriding=true
