# Application Name
spring.application.name=starter_project_2025
server.port=8080

# ---- Active Profile ----
spring.profiles.active=${APP_PROFILE:mysql}

# ---- File Storage ----
app.file.upload-dir=${FILE_UPLOAD_DIR:uploads}
app.file.max-size=${FILE_MAX_SIZE:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ---- Rate Limiting ----
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:120}

# ---- Redis Cache ----
app.cache.enabled=${CACHE_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---- Async ----
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

