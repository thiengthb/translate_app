# Default (English) bundle for server-side localised errors.
#
# Keys must match exactly between locales. Add new entries here first,
# then mirror to messages_vi.properties and messages_ja.properties.
#
# Placeholders use the `{0}`, `{1}` MessageFormat syntax (NOT `{name}`).

# ---- Auth ----
error.auth.notAuthenticated=Not authenticated
error.auth.googleEmailRequired=Google account email is required
error.auth.emailExists=Email already exists
error.auth.invalidCredentials=Invalid email or password
error.auth.tooManyAttempts=Too many failed attempts. Try again in {0} seconds.

# ---- Tokens ----
error.token.invalidRefresh=Invalid refresh token
error.token.refreshRevoked=Refresh token has been revoked
error.token.refreshExpired=Refresh token has expired
error.token.alreadyUsed=Token already used
error.token.expired=Token expired
error.token.invalidType=Invalid token type

# ---- Verification / forgot-password throttling ----
error.verify.throttle=Please wait before requesting another email.

# ---- Profile ----
error.profile.userNotFound=User not found
error.profile.passwordMismatch=New password and confirm password do not match
error.profile.currentPasswordWrong=Current password is incorrect
error.profile.newPasswordSame=New password must be different from current password
error.profile.unsupportedLocale=Unsupported locale: {0}
error.profile.unsupportedTheme=Unsupported theme: {0}
error.profile.sessionNotFound=Session not found

# ---- Generic 4xx framework messages ----
error.accessDenied=You don''t have permission to access this resource
error.validationFailed=Validation failed
error.unexpected=An unexpected error occurred: {0}

# ---- BeanValidation messages ----
# Referenced as @NotBlank(message = "{validation.email.required}") etc.
# Spring's LocalValidatorFactoryBean resolves these through MessageSource.
validation.email.required=Email is required
validation.email.invalid=Invalid email format
validation.password.required=Password is required
validation.password.size=Password must be between 8 and 100 characters
validation.firstName.required=First name is required
validation.firstName.size=First name must be between 2 and 100 characters
validation.firstName.max=First name must be at most 100 characters
validation.lastName.required=Last name is required
validation.lastName.max=Last name must be at most 100 characters
validation.phone.max=Phone must be at most 20 characters
validation.bio.max=Bio must be at most 500 characters
validation.token.required=Token is required
validation.token.blank=Token cannot be blank
validation.idToken.required=ID token is required
validation.newPassword.required=New password is required
validation.newPassword.size=New password must be between 8 and 100 characters
validation.currentPassword.required=Current password is required
validation.confirmPassword.required=Confirm password is required
validation.avatarUrl.required=Avatar URL is required
validation.locale.required=Locale is required
validation.locale.pattern=Invalid locale code
validation.theme.required=Theme is required
validation.theme.pattern=Invalid theme
