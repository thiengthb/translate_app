# Vietnamese bundle — keys must mirror messages.properties exactly.
# Use Unicode escapes (\u...) — Spring Boot 3 still defaults ResourceBundle
# to ISO-8859-1 when reading .properties files even though our config sets
# encoding to UTF-8; the escapes work in both modes.
#
# Source values (for review):
#   error.auth.notAuthenticated   = Chưa đăng nhập
#   error.auth.googleEmailRequired = Tài khoản Google phải có email
#   error.auth.emailExists        = Email đã tồn tại
#   error.auth.invalidCredentials = Email hoặc mật khẩu không đúng
#   error.auth.tooManyAttempts    = Quá nhiều lần thất bại. Hãy thử lại sau {0} giây.
#   error.token.invalidRefresh    = Refresh token không hợp lệ
#   error.token.refreshRevoked    = Refresh token đã bị thu hồi
#   error.token.refreshExpired    = Refresh token đã hết hạn
#   error.token.alreadyUsed       = Token đã được sử dụng
#   error.token.expired           = Token đã hết hạn
#   error.token.invalidType       = Loại token không hợp lệ
#   error.verify.throttle         = Vui lòng đợi trước khi yêu cầu email khác.
#   error.profile.userNotFound    = Không tìm thấy người dùng
#   error.profile.passwordMismatch= Mật khẩu mới và xác nhận không khớp
#   error.profile.currentPasswordWrong = Mật khẩu hiện tại không đúng
#   error.profile.newPasswordSame = Mật khẩu mới phải khác mật khẩu hiện tại
#   error.profile.unsupportedLocale = Ngôn ngữ không được hỗ trợ: {0}
#   error.profile.unsupportedTheme  = Giao diện không được hỗ trợ: {0}
#   error.profile.sessionNotFound = Không tìm thấy phiên
#   error.accessDenied            = Bạn không có quyền truy cập tài nguyên này
#   error.validationFailed        = Dữ liệu không hợp lệ
#   error.unexpected              = Đã có lỗi không mong muốn: {0}

